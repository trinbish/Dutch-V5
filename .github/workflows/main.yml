name: Build APK
on:
push:
branches: [ "main" ]
jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout
  uses: actions/checkout@v3

- name: Build APK
  uses: android-actions/build-apk@v2

- name: Upload APK
  uses: actions/upload-artifact@v3
  with:
    name: app
    path: app/build/outputs/apk/debug/app-debug.apk
